<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="216" viewBox="0 0 1200 216" role="img" aria-labelledby="title desc"><title id="title">Datos públicos de GitHub</title><desc id="desc">Repositorios propios y distribución del lenguaje principal por repositorio. No es una escala de dominio.</desc><style>text{font-family:Arial,Helvetica,sans-serif}.metric{animation:appear 1.2s ease-out both}.second{animation-delay:.18s}.slice{animation:appear 1.5s ease-out both}.halo{transform-origin:663px 107px;animation:orbit 12s linear infinite}@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.metric,.slice,.halo{animation:none}}
.metric-sweep{stroke-dasharray:42 168;animation:metric-sweep 7s ease-in-out infinite}
.metric-sweep.second{animation-delay:-3.5s}
.ring-beacon{transform-origin:663px 107px;animation:orbit 9s linear infinite}
@keyframes metric-sweep{0%,100%{stroke-dashoffset:210;opacity:.2}50%{stroke-dashoffset:0;opacity:.75}}
@media(prefers-reduced-motion:reduce){.metric-sweep,.ring-beacon{animation:none}.metric-sweep{stroke-dasharray:none;opacity:.25}}
</style><rect x="1" y="1" width="1198" height="214" rx="14" fill="#0d1117" stroke="#30363d"/><text x="30" y="35" font-size="13" fill="#8b949e" font-weight="400" letter-spacing="2">GITHUB / DATOS PÚBLICOS</text><path d="M538 28V187" stroke="#30363d"/><text x="38" y="123" font-size="53" fill="#edf1f5" font-weight="700" class="metric">20</text><text x="269" y="123" font-size="53" fill="#edf1f5" font-weight="700" class="metric second">4</text><text x="40" y="157" font-size="16" fill="#8b949e" font-weight="400" >Repositorios propios</text><text x="270" y="157" font-size="16" fill="#8b949e" font-weight="400" >Lenguajes principales</text><text x="1128" y="35" font-size="27" fill="#a3b1bf" font-weight="400" >↗</text><text x="782" y="58" font-size="17" fill="#c9d1d9" font-weight="600" >Lenguaje principal · repositorios</text><circle cx="663" cy="107" r="58" fill="none" stroke="#212830" stroke-width="16"/><circle class="slice" style="animation-delay:0.00s" cx="663" cy="107" r="58" fill="none" stroke="#98c8dc" stroke-width="16" stroke-dasharray="263.196 101.229" stroke-dashoffset="0.000" transform="rotate(-90 663 107)"/><circle cx="788" cy="85" r="4" fill="#98c8dc"/><text x="805" y="90" font-size="16" fill="#aebbc8" font-weight="400" >HTML</text><text x="1119" y="90" font-size="16" fill="#e5eaf0" font-weight="600" text-anchor="end">13</text><circle class="slice" style="animation-delay:0.12s" cx="663" cy="107" r="58" fill="none" stroke="#91a9d8" stroke-width="16" stroke-dasharray="60.737 303.687" stroke-dashoffset="-263.196" transform="rotate(-90 663 107)"/><circle cx="788" cy="110" r="4" fill="#91a9d8"/><text x="805" y="115" font-size="16" fill="#aebbc8" font-weight="400" >JavaScript</text><text x="1119" y="115" font-size="16" fill="#e5eaf0" font-weight="600" text-anchor="end">3</text><circle class="slice" style="animation-delay:0.24s" cx="663" cy="107" r="58" fill="none" stroke="#b1a0d0" stroke-width="16" stroke-dasharray="20.246 344.179" stroke-dashoffset="-323.933" transform="rotate(-90 663 107)"/><circle cx="788" cy="135" r="4" fill="#b1a0d0"/><text x="805" y="140" font-size="16" fill="#aebbc8" font-weight="400" >Notebooks</text><text x="1119" y="140" font-size="16" fill="#e5eaf0" font-weight="600" text-anchor="end">1</text><circle class="slice" style="animation-delay:0.36s" cx="663" cy="107" r="58" fill="none" stroke="#687ba2" stroke-width="16" stroke-dasharray="20.246 344.179" stroke-dashoffset="-344.179" transform="rotate(-90 663 107)"/><circle cx="788" cy="160" r="4" fill="#687ba2"/><text x="805" y="165" font-size="16" fill="#aebbc8" font-weight="400" >CSS</text><text x="1119" y="165" font-size="16" fill="#e5eaf0" font-weight="600" text-anchor="end">1</text><circle class="halo" cx="663" cy="107" r="75" fill="none" stroke="url(#metric-accent)" stroke-width="1.3" stroke-dasharray="16 39" opacity=".65"/><text x="663" y="115" font-size="29" fill="#e5eaf0" font-weight="600" text-anchor="middle">18</text><text x="32" y="196" font-size="11" fill="#687789" font-weight="400" >02/10/2026</text>
