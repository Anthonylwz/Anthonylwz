="1.2">FORKS RECIBIDOS</text><text x="984" y="106" font-size="45" fill="#edf4ff" font-weight="700" >1</text><text x="984" y="134" font-size="12" fill="#8fa3bf" font-weight="400" >En proyectos públicos</text><text x="28" y="197" font-size="12" fill="#a995ff" font-weight="700" letter-spacing="2">LENGUAJE PRINCIPAL POR PROYECTO</text><text x="28" y="224" font-size="14" fill="#8fa3bf" font-weight="400" >18 repositorios con lenguaje identificado</text><rect x="28.00" y="245" width="866.67" height="15" fill="#fb8b9a"/><circle cx="34" cy="285" r="5" fill="#fb8b9a"/><text x="47" y="290" font-size="14" fill="#c4d0e3" font-weight="400" >HTML · 13 (72%)</text><rect x="894.67" y="245" width="200.00" height="15" fill="#f5d574"/><circle cx="334" cy="285" r="5" fill="#f5d574"/><text x="347" y="290" font-size="14" fill="#c4d0e3" font-weight="400" >JavaScript · 3 (17%)</text><rect x="1094.67" y="245" width="66.67" height="15" fill="#b4a2ff"/><circle cx="634" cy="285" r="5" fill="#b4a2ff"/><text x="647" y="290" font-size="14" fill="#c4d0e3" font-weight="400" >CSS · 1 (6%)</text><rect x="1161.33" y="245" width="66.67" height="15" fill="#42e8e0"/><circle cx="934" cy="285" r="5" fill="#42e8e0"/><text x="947" y="290" font-size="14" fill="#c4d0e3" font-weight="400" >Jupyter Notebook · 1 (6%)</text><path d="M28 331H1252" stroke="#26354c"/><circle cx="34" cy="353" r="4" fill="#42e8e0" class="light"/><text x="47" y="358" font-size="12" fill="#8fa3bf" font-weight="400" >Actualizado: 30/09/2026 · Solo proyectos públicos · Perfil excluido del cálculo</text><text x="1073" y="358" font-size="11" fill="#42e8e0" font-weight="700" letter-spacing="1">GITHUB / METRICS</text></svg>