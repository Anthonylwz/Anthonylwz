<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="255" viewBox="0 0 1200 255" role="img" aria-labelledby="title desc"><title id="title">GitHub: repositorios públicos y lenguajes principales</title><desc id="desc">Datos de repositorios públicos propios, excluido el repositorio de presentación. El gráfico cuenta el lenguaje principal de cada repositorio.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x="1" y="1" width="560" height="253" rx="12" fill="#0d1117" stroke="#30363d"/><rect x="578" y="1" width="621" height="253" rx="12" fill="#0d1117" stroke="#30363d"/><text x="26" y="39" font-size="21" fill="#c9d1d9" font-weight="600" >GitHub / datos públicos</text><text x="28" y="107" font-size="43" fill="#edf1f5" font-weight="700" >20</text><text x="265" y="107" font-size="43" fill="#edf1f5" font-weight="700" >4</text><text x="28" y="138" font-size="15" fill="#8b949e" font-weight="400" >Repositorios propios</text><text x="265" y="138" font-size="15" fill="#8b949e" font-weight="400" >Lenguajes principales</text><path d="M26 169H535" stroke="#30363d"/><text x="26" y="199" font-size="15" fill="#8b949e" font-weight="400" >Versiones, código e historial en GitHub.</text><text x="26" y="228" font-size="12" fill="#768390" font-weight="400" >Actualizado: 30/09/2026</text><text x="603" y="39" font-size="21" fill="#c9d1d9" font-weight="600" >Lenguaje principal por repositorio</text><text x="603" y="67" font-size="13" fill="#8b949e" font-weight="400" >18 repositorios públicos con lenguaje detectado</text><rect x="604.00" y="90" width="408.06" height="12" fill="#a3b1bf"/><circle cx="611" cy="135" r="4" fill="#a3b1bf"/><text x="623" y="140" font-size="14" fill="#b6c2cf" font-weight="400" >HTML · 13</text><rect x="1012.06" y="90" width="94.17" height="12" fill="#788b9f"/><circle cx="893" cy="135" r="4" fill="#788b9f"/><text x="905" y="140" font-size="14" fill="#b6c2cf" font-weight="400" >JavaScript · 3</text><rect x="1106.22" y="90" width="31.39" height