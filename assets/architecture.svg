<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="251" viewBox="0 0 1280 251" role="img" aria-labelledby="title desc"><title id="title">Interfaz, lógica y datos: áreas que conecto al crear software</title><desc id="desc">Diseño original para el perfil público de Anthony Alex. Las animaciones respetan la preferencia de movimiento reducido.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080e1c"/><stop offset="1" stop-color="#211735"/></linearGradient><linearGradient id="accent"><stop stop-color="#42e8e0"/><stop offset=".55" stop-color="#a995ff"/><stop offset="1" stop-color="#f3a6ca"/></linearGradient><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity=".04"/></pattern></defs><style>
text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,monospace}
.dash{stroke-dasharray:5 12;animation:route 18s linear infinite}
.float{animation:float 6s ease-in-out infinite}.float2{animation:float 7s ease-in-out infinite;animation-delay:-3s}
.blink{animation:blink 1.2s steps(2,end) infinite}.pulse{animation:pulse 4s ease-in-out infinite}
.spin{transform-origin:1020px 248px;animation:spin 45s linear infinite}
.scan{animation:scan 7s ease-in-out infinite}.crawl{animation:route 12s linear infinite}
@keyframes route{to{stroke-dashoffset:-340}}@keyframes float{50%{transform:translateY(-9px)}}
@keyframes blink{50%{opacity:0}}@keyframes pulse{50%{opacity:.35}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes scan{50%{transform:translateY(108px)}}
@media(prefers-reduced-motion:reduce){.dash,.float,.float2,.blink,.pulse,.spin,.scan,.crawl{animation:none}}
</style><rect x="1" y="1" width="1278" height="249" rx="18" fill="#080d19" stroke="#26354c" /><text x="28" y="37" font-size="12" fill="#42e8e0" font-weight="700" letter-spacing="3">CÓMO CONECTO MIS INTERESES</text><path d="M316 131H482M771 131H943" fill="none" stroke="#42e8e0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="dash"/><rect x="28" y="71" width="310" height="125" rx="15" fill="#111c30" stroke="#26354c" /><text x="50" y="106" font-size="22" fill="#42e8e0" font-weight="700" class="mono">&lt;/&gt;</text><text x="50" y="142" font-size="21" fill="#edf4ff" font-weight="700" >INTERFAZ</text><text x="50" y="173" font-size="13" fill="#8fa3bf" font-weight="400" >Diseño · interacción · movimiento</text><rect x="482" y="71" width="310" height="125" rx="15" fill="#111c30" stroke="#26354c" /><text x="504" y="106" font-size="22" fill="#a995ff" font-weight="700" class="mono">{}</text><text x="504" y="142" font-size="21" fill="#edf4ff" font-weight="700" >LÓGICA</text><text x="504" y="173" font-size="13" fill="#8fa3bf" font-weight="400" >Backend · scripts · automatización</text><rect x="936" y="71" width="310" height="125" rx="15" fill="#111c30" stroke="#26354c" /><text x="958" y="106" font-size="22" fill="#f3a6ca" font-weight="700" class="mono">DB</text><text x="958" y="142" font-size="21" fill="#edf4ff" font-weight="700" >DATOS</text><text x="958" y="173" font-size="13" fill="#8fa3bf" font-weight="400" >SQL · modelado · servicios cloud</text><text x="28" y="227" font-size="14" fill="#8fa3bf" font-weight="400" >Del primer boceto a una experiencia funcional: construir, conectar y mejorar.</text></svg>