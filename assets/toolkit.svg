" font-size="26" fill="#0d1628" font-weight="700" text-anchor="middle">My</text><text x="1053" y="196" font-size="13" fill="#edf4ff" font-weight="600" text-anchor="middle">MySQL</text><rect x="1124" y="90" width="112" height="128" rx="12" fill="#101a2c" stroke="#26354c" /><rect x="1148" y="109" width="64" height="61" rx="12" fill="#f8b955" stroke="none" /><text x="1180" y="149" font-size="26" fill="#0d1628" font-weight="700" text-anchor="middle">Fb</text><text x="1180" y="196" font-size="13" fill="#edf4ff" font-weight="600" text-anchor="middle">Firebase</text><text x="870" y="258" font-size="13" fill="#8fa3bf" font-weight="400" >Consultas · modelado · integración cloud</text></svg>