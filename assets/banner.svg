<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Anthony Alex — Creative Developer</title><desc id="desc">Banner oscuro con líneas de circuitos animadas, acentos cian y violeta y una terminal de proyectos.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080e1c"/><stop offset="1" stop-color="#1c1538"/></linearGradient><linearGradient id="accent"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern></defs>
<style>
.flow{stroke-dasharray:10 18;animation:flow 12s linear infinite}.cursor{animation:blink 1.4s steps(2,end) infinite}.orb{animation:float 8s ease-in-out infinite}.pulse{animation:pulse 4s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-280}}@keyframes blink{50%{opacity:0}}@keyframes float{50%{transform:translateY(-12px)}}@keyframes pulse{50%{opacity:.45}}
@media(prefers-reduced-motion:reduce){.flow,.cursor,.orb,.pulse{animation:none}}
</style>
<rect width="1200" height="360" rx="24" fill="url(#bg)"/><rect width="1200" height="360" rx="24" fill="url(#grid)"/>
<circle class="orb" cx="1090" cy="70" r="100" fill="#a78bfa" opacity=".07"/>
<path class="flow" d="M0 295H125L175 245H330M850 45H975L1020 90H1200M930 330H1080L1140 270H1200" fill="none" stroke="url(#accent)" stroke-width="2" opacity=".65"/>
<rect x="52" y="49" width="176" height="28" rx="14" fill="#22d3ee" fill-opacity=".1" stroke="#22d3ee" stroke-opacity=".35"/>
<circle class="pulse" cx="69" cy="63" r="4" fill="#22d3ee"/><text x="82" y="68" fill="#67e8f9" font-family="Arial,sans-serif" font-size="11" letter-spacing="2">ANTHONYLWZ / GITHUB</text>
<text x="52" y="154" fill="#f8fafc" font-family="Arial,sans-serif" font-size="58" font-weight="700">Anthony Alex<tspan class="cursor" fill="#22d3ee">_</tspan></text>
<text x="55" y="199" fill="#c4b5fd" font-family="Arial,sans-serif" font-size="21" letter-spacing="3">CREATIVE DEVELOPER</text>
<text x="55" y="239" fill="#94a3b8" font-family="Arial,sans-serif" font-size="17">Desarrollo web · Software · Interfaces con movimiento</text>
<rect x="55" y="276" width="245" height="3" rx="2" fill="url(#accent)"/>
<g transform="translate(760 100)">
<rect width="382" height="170" rx="14" fill="#0b1220" stroke="#334155"/>
<path d="M0 38H382" stroke="#334155"/><circle cx="20" cy="20" r="5" fill="#fb7185"/><circle cx="38" cy="20" r="5" fill="#fbbf24"/><circle cx="56" cy="20" r="5" fill="#34d399"/>
<text x="95" y="25" fill="#94a3b8" font-family="monospace" font-size="12">projects / build / create</text>
<text x="22" y="72" fill="#67e8f9" font-family="monospace" font-size="14">&gt; crear experiencias</text>
<text x="22" y="102" fill="#c4b5fd" font-family="monospace" font-size="14">  commerce · negocios · web</text>
<text x="22" y="137" fill="#34d399" font-family="monospace" font-size="14">✓ ideas convertidas en código</text>
</g></svg>