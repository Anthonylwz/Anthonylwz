<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80" role="img" aria-labelledby="title">
<title id="title">Tailwind CSS</title>
<style>
.tile{animation:wave 6.8s cubic-bezier(.22,.7,.3,1) 1.20s infinite}
.logo{transform-origin:40px 40px;animation:spring 6.8s cubic-bezier(.22,.7,.3,1) 1.20s infinite}
@keyframes wave{0%,44%,100%{transform:translateY(0)}5%{transform:translateY(2px)}15%,23%{transform:translateY(-5px)}31%{transform:translateY(1px)}38%{transform:translateY(0)}}
@keyframes spring{0%,44%,100%{transform:scale(1)}5%{transform:scale(1.02,.98)}15%,23%{transform:scale(1.04)}31%{transform:scale(1.015,.985)}38%{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.tile,.logo{animation:none}}
</style>
<g class="tile">
<rect x="5" y="5" width="70" height="70" rx="17" fill="#202731" stroke="#748091" stroke-opacity=".18"/>
