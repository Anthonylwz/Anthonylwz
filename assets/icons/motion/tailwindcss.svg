<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80" role="img" aria-labelledby="title">
<title id="title">Tailwind CSS</title>
<defs>
<linearGradient id="glass" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".06"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
<linearGradient id="shine"><stop stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".09"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
<clipPath id="clip"><rect x="5" y="5" width="70" height="70" rx="17"/></clipPath>
</defs>
<style>
.tile{animation:float 6.199999999999999s ease-in-out -2.3499999999999996s infinite}
.logo{transform-origin:40px 40px;animation:drift 6.199999999999999s ease-in-out -2.3499999999999996s infinite}
.edge{stroke-dasharray:34 228;animation:edge 10s linear -2.3499999999999996s infinite}
.sheen{animation:shine 9.5s ease-in-out -2.3499999999999996s infinite}
.status{animation:pulse 3.5s ease-in-out -2.3499999999999996s infinite}
@keyframes float{0%,100%{transform:translateY(2px)}50%{transform:translateY(-2px)}}
@keyframes tilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes breathe{0%,100%{transform:scale(.93)}50%{transform:scale(1.04)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes lift{0%,100%{transform:translateY(3px) scale(.96)}50%{transform:translateY(-4px) scale(1.04)}}
@keyframes drift{0%,100%{transform:translateX(-3px) rotate(-3deg)}50%{transform:translateX(3px) rotate(3deg)}}
@keyframes edge{to{stroke-dashoffset:-262}}
@keyframes shine{0%,15%{transform:translateX(-90px)}65%,100%{transform:translateX(100px)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}
@media(prefers-reduced-motion:reduce){.tile,.logo,.edge,.sheen,.status{animation:none}.sheen{display:none}.edge{stroke-dasharray:none;opacity:.35}}
</style>
<g class="tile">
<rect x="5" y="5" width="70" height="70" rx="17" fill="#202731"/>
<rect x="5" y="5" width="70" height="70" rx="17" fill="url(#glass)" stroke="#6dc9dd" stroke-opacity=".18"/>
<rect class="edge" x="5" y="5" width="70" height="70" rx="17" fill="none" stroke="#6dc9dd" stroke-width="1.3" stroke-linecap="round" opacity=".8"/>
<g class="logo"><svg x="16" y="16" width="48" height="48" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><path d="M64.004 25.602c-17.067 0-27.73 8.53-32 25.597 6.398-8.531 13.867-11.73 22.398-9.597 4.871 1.214 8.352 4.746 12.207 8.66C72.883 56.629 80.145 64 96.004 64c17.066 0 27.73-8.531 32-25.602-6.399 8.536-13.867 11.735-22.399 9.602-4.87-1.215-8.347-4.746-12.207-8.66-6.27-6.367-13.53-13.738-29.394-13.738zM32.004 64c-17.066 0-27.73 8.531-32 25.602C6.402 81.066 13.87 77.867 22.402 80c4.871 1.215 8.352 4.746 12.207 8.66 6.274 6.367 13.536 13.738 29.395 13.738 17.066 0 27.73-8.53 32-25.597-6.399 8.531-13.867 11.73-22.399 9.597-4.87-1.214-8.347-4.746-12.207-8.66C55.128 71.371 47.868 64 32.004 64zm0 0" fill="#38bdf8"/></svg></g>
<g clip-path="url(#clip)"><path class="sheen" d="M-28 3H-2L32 77H6Z" fill="url(#shine)"/></g>
<circle class="status" cx="64" cy="64" r="1.8" fill="#6dc9dd"/>
</g>
</svg>