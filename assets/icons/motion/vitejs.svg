<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80" role="img" aria-labelledby="title">
<title id="title">Vite</title>
<style>
.tile{animation:wave 6.8s cubic-bezier(.22,.7,.3,1) 0.96s infinite}
.logo{transform-origin:40px 40px;animation:spring 6.8s cubic-bezier(.22,.7,.3,1) 0.96s infinite}
