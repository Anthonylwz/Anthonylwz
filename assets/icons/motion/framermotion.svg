<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80" role="img" aria-labelledby="title">
<title id="title">Motion / Framer Motion</title>
<style>
.tile{animation:float 6.8s ease-in-out -2.82s infinite}
.logo{transform-origin:40px 40px;animation:lift 6.8s ease-in-out -2.82s infinite}
@keyframes float{0%,100%{transform:translateY(2px)}50%{transform:translateY(-2px)}}
@keyframes tilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes breathe{0%,100%{transform:scale(.93)}50%{transform:scale(1.04)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes lift{0%,100%{transform:translateY(3px) scale(.96)}50%{transform:translateY(-4px) scale(1.04)}}
@keyframes drift{0%,100%{transform:translateX(-3px) rotate(-3deg)}50%{transform:translateX(3px) rotate(3deg)}}
@media(prefers-reduced-motion:reduce){.tile,.logo{animation:none}}
</style>
<g class="tile">
<rect x="5" y="5" width="70" height="70" rx="17" fill="#dde3ea" stroke="#748091" stroke-opacity=".18"/>
<g class="logo"><svg x="16" y="16" width="48" height="48" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg"><path d="M22.684 0h84.253v42.667H64.81L22.684 0Zm0 42.667H64.81l42.127 42.666H64.81V128L22.684 85.333V42.667Z"/></svg></g>
</g>
</svg>