<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80" role="img" aria-labelledby="title">
<title id="title">HTML5</title>
<defs>
<linearGradient id="glass" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".06"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
<linearGradient id="shine"><stop stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".09"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
<clipPath id="clip"><rect x="5" y="5" width="70" height="70" rx="17"/></clipPath>
</defs>
<style>
.tile{animation:float 5.6s ease-in-out 0.0s infinite}
.logo{transform-origin:40px 40px;animation:float 5.6s ease-in-out 0.0s infinite}
.edge{stroke-dasharray:34 228;animation:edge 8s linear 0.0s infinite}
.sheen{animation:shine 7.5s ease-in-out 0.0s infinite}
.status{animation:pulse 3.5s ease-in-out 0.0s infinite}
@keyframes float{0%,100%{transform:translateY(2px)}50%{transform:translateY(-2px)}}
@keyframes tilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes breathe{0%,100%{transform:scale(.93)}50%{transform:scale(1.04)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes lift{0%,100%{transform:translateY(3px) scale(.96)}50%{transform:translateY(-4px) scale(1.04)}}
@keyframes drift{0%,100%{transform:translateX(-3px) rotate(-3deg)}50%{transform:translateX(3px) rotate(3deg)}}
@keyframes edge{to{stroke-dashoffset:-262}}
@keyframes shine{0%,15%{transform:translateX(-90px)}65%,100%{transform:translateX(100px)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}
@media(prefers-reduced-motion:reduce){.tile,.logo,.edge,.sheen,.status{animation:none}.sheen{display:none}.edge{stroke-dasharray:none;opacity:.35}}
</style>
<g class="tile">
<rect x="5" y="5" width="70" height="70" rx="17" fill="#202731"/>
<rect x="5" y="5" width="70" height="70" rx="17" fill="url(#glass)" stroke="#ef896c" stroke-opacity=".18"/>
<rect class="edge" x="5" y="5" width="70" height="70" rx="17" fill="none" stroke="#ef896c" stroke-width="1.3" stroke-linecap="round" opacity=".8"/>
<g class="logo"><svg x="16" y="16" width="48" height="48" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><path fill="#E44D26" d="M19.037 113.876L9.032 1.661h109.936l-10.016 112.198-45.019 12.48z"/><path fill="#F16529" d="M64 116.8l36.378-10.086 8.559-95.878H64z"/><path fill="#EBEBEB" d="M64 52.455H45.788L44.53 38.361H64V24.599H29.489l.33 3.692 3.382 37.927H64zm0 35.743l-.061.017-15.327-4.14-.979-10.975H33.816l1.928 21.609 28.193 7.826.063-.017z"/><path fill="#fff" d="M63.952 52.455v13.763h16.947l-1.597 17.849-15.35 4.143v14.319l28.215-7.82.207-2.325 3.234-36.233.335-3.696h-3.708zm0-27.856v13.762h33.244l.276-3.092.628-6.978.329-3.692z"/></svg></g>
<g clip-path="url(#clip)"><path class="sheen" d="M-28 3H-2L32 77H6Z" fill="url(#shine)"/></g>
<circle class="status" cx="64" cy="64" r="1.8" fill="#ef896c"/>
</g>
</svg>