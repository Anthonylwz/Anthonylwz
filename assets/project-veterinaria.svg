<svg xmlns="http://www.w3.org/2000/svg" width="620" height="327" viewBox="0 0 620 327" role="img" aria-labelledby="title desc"><title id="title">Veterinaria Pariona · SERVICIOS / PET SHOP</title><desc id="desc">Diseño original para el perfil público de Anthony Alex. Las animaciones respetan la preferencia de movimiento reducido.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080e1c"/><stop offset="1" stop-color="#211735"/></linearGradient><linearGradient id="accent"><stop stop-color="#42e8e0"/><stop offset=".55" stop-color="#a995ff"/><stop offset="1" stop-color="#f3a6ca"/></linearGradient><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity=".04"/></pattern></defs><style>
text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,monospace}
.dash{stroke-dasharray:5 12;animation:route 18s linear infinite}
.float{animation:float 6s ease-in-out infinite}.float2{animation:float 7s ease-in-out infinite;animation-delay:-3s}
.blink{animation:blink 1.2s steps(2,end) infinite}.pulse{animation:pulse 4s ease-in-out infinite}
.spin{transform-origin:1020px 248px;animation:spin 45s linear infinite}
.scan{animation:scan 7s ease-in-out infinite}.crawl{animation:route 12s linear infinite}
@keyframes route{to{stroke-dashoffset:-340}}@keyframes float{50%{transform:translateY(-9px)}}
@keyframes blink{50%{opacity:0}}@keyframes pulse{50%{opacity:.35}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes scan{50%{transform:translateY(108px)}}
@media(prefers-reduced-motion:reduce){.dash,.float,.float2,.blink,.pulse,.spin,.scan,.crawl{animation:none}}
</style><rect x="1" y="1" width="618" height="325" rx="18" fill="#080d19" stroke="#26354c" /><rect x="1" y="1" width="618" height="135" rx="18" fill="url(#bg)"/><text x="24" y="31" font-size="11" fill="#a995ff" font-weight="700" letter-spacing="2">SERVICIOS / PET SHOP</text><text x="579" y="34" font-size="15" fill="#8fa3bf" font-weight="400" class="mono">02</text><path d="M24 107H144L170 81H321L350 107H458" fill="none" stroke="#a995ff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" class="dash" opacity=".5"/><g class="float"><circle cx="442" cy="70" r="9" fill="#a995ff" /><circle cx="464" cy="59" r="9" fill="#a995ff" /><circle cx="487" cy="63" r="9" fill="#a995ff" /><circle cx="507" cy="80" r="8" fill="#a995ff" /><path d="M456 86C430 112 453 121 469 112C485 128 514 113 490 90C478 78 469 78 456 86Z" fill="#a995ff"/><path d="M550 51V100M526 76H574" fill="none" stroke="#a995ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /></g><text x="24" y="176" font-size="26" fill="#edf4ff" font-weight="700" >Veterinaria Pariona</text><text x="24" y="206" font-size="16" fill="#8fa3bf" font-weight="400" >Servicios, productos y contacto.</text><text x="24" y="230" font-size="16" fill="#8fa3bf" font-weight="400" >Asistente conversacional integrado.</text><rect x="24" y="255" width="58" height="28" rx="14" fill="#0e192b" stroke="#a995ff" stroke-opacity=".5"/><text x="38" y="274" font-size="12" fill="#a995ff" font-weight="600" letter-spacing="1">HTML</text><rect x="91" y="255" width="56" height="28" rx="14" fill="#0e192b" stroke="#a995ff" stroke-opacity=".5"/><text x="105" y="274" font-size="12" fill="#a995ff" font-weight="600" letter-spacing="1">CSS</text><rect x="156" y="255" width="106" height="28" rx="14" fill="#0e192b" stroke="#a995ff" stroke-opacity=".5"/><text x="170" y="274" font-size="12" fill="#a995ff" font-weight="600" letter-spacing="1">JavaScript</text><text x="24" y="307" font-size="11" fill="#a995ff" font-weight="700" letter-spacing="2">EXPLORAR REPOSITORIO</text><path d="M576 294L589 301L576 308M561 301H589" fill="none" stroke="#a995ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>