<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc"><title id="title">Anthony Alex Flores Piuca · Desarrollo web, software y tecnología creativa</title><desc id="desc">Diseño original para el perfil público de Anthony Alex. Las animaciones respetan la preferencia de movimiento reducido.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080e1c"/><stop offset="1" stop-color="#211735"/></linearGradient><linearGradient id="accent"><stop stop-color="#42e8e0"/><stop offset=".55" stop-color="#a995ff"/><stop offset="1" stop-color="#f3a6ca"/></linearGradient><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity=".04"/></pattern></defs><style>
text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,monospace}
.dash{stroke-dasharray:5 12;animation:route 18s linear infinite}
.float{animation:float 6s ease-in-out infinite}.float2{animation:float 7s ease-in-out infinite;animation-delay:-3s}
.blink{animation:blink 1.2s steps(2,end) infinite}.pulse{animation:pulse 4s ease-in-out infinite}
.spin{transform-origin:1020px 248px;animation:spin 45s linear infinite}
.scan{animation:scan 7s ease-in-out infinite}.crawl{animation:route 12s linear infinite}
@keyframes route{to{stroke-dashoffset:-340}}@keyframes float{50%{transform:translateY(-9px)}}
@keyframes blink{50%{opacity:0}}@keyframes pulse{50%{opacity:.35}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes scan{50%{transform:translateY(108px)}}
@media(prefers-reduced-motion:reduce){.dash,.float,.float2,.blink,.pulse,.spin,.scan,.crawl{animation:none}}
</style><rect x="1" y="1" width="1278" height="518" rx="24" fill="url(#bg)" stroke="#26354c" /><rect x="1" y="1" width="1278" height="518" rx="24" fill="url(#grid)"/><ellipse cx="1040" cy="248" rx="240" ry="207" fill="#a995ff" opacity=".055"/><path d="M1 447H154L181 420H668L710 378H906" fill="none" stroke="#42e8e0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="dash" opacity=".35"/><path d="M1090 1V66L1144 120H1279" fill="none" stroke="#a995ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="dash" opacity=".5"/><text x="44" y="44" font-size="13" fill="#42e8e0" font-weight="700" letter-spacing="3">ANTHONY / DIGITAL WORKSPACE</text><text x="1050" y="44" font-size="12" fill="#8fa3bf" font-weight="400" class="mono">PROFILE  /  v.02</text><path d="M44 64H1236" fill="none" stroke="#26354c" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><rect x="44" y="89" width="320" height="28" rx="14" fill="#0e192b" stroke="#a995ff" stroke-opacity=".5"/><text x="58" y="108" font-size="12" fill="#a995ff" font-weight="600" letter-spacing="1">WEB · SOFTWARE · CREATIVE TECH</text><text x="44" y="186" font-size="76" fill="#edf4ff" font-weight="700" letter-spacing="-3">Anthony Alex</text><text x="46" y="221" font-size="17" fill="#8fa3bf" font-weight="600" letter-spacing="7">FLORES PIUCA</text><text x="44" y="276" font-size="29" fill="#edf4ff" font-weight="400" >Convierto ideas en</text><text x="44" y="315" font-size="33" fill="#42e8e0" font-weight="700" >experiencias digitales.</text><text x="45" y="352" font-size="18" fill="#8fa3bf" font-weight="400" >Código, diseño y movimiento en un mismo lugar.</text><rect x="44" y="388" width="128" height="28" rx="14" fill="#0e192b" stroke="#42e8e0" stroke-opacity=".5"/><text x="58" y="407" font-size="12" fill="#42e8e0" font-weight="600" letter-spacing="1">FRONTEND</text><rect x="183" y="388" width="118" height="28" rx="14" fill="#0e192b" stroke="#a995ff" stroke-opacity=".5"/><text x="197" y="407" font-size="12" fill="#a995ff" font-weight="600" letter-spacing="1">BACKEND</text><rect x="312" y="388" width="134" height="28" rx="14" fill="#0e192b" stroke="#f3a6ca" stroke-opacity=".5"/><text x="326" y="407" font-size="12" fill="#f3a6ca" font-weight="600" letter-spacing="1">DATABASES</text><circle cx="52" cy="470" r="4" fill="#42e8e0" class="pulse"/><text x="67" y="475" font-size="14" fill="#8fa3bf" font-weight="400" >SENATI · Ingeniería de Software con IA</text><g class="spin"><path d="M1020 91A157 157 0 1 1 1019.99 91" fill="none" stroke="#a995ff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 12" opacity=".5"/><circle cx="1020" cy="91" r="4" fill="#42e8e0" /><circle cx="1020" cy="405" r="4" fill="#a995ff" /></g><g class="float"><rect x="731" y="127" width="466" height="265" rx="18" fill="#0d1628" stroke="#405570" /><rect x="732" y="128" width="464" height="40" rx="17" fill="#17243b" stroke="none" /><circle cx="752" cy="148" r="5" fill="#fb7185" /><circle cx="770" cy="148" r="5" fill="#fbbf24" /><circle cx="788" cy="148" r="5" fill="#34d399" /><text x="811" y="153" font-size="13" fill="#8fa3bf" font-weight="400" class="mono">anthony@workspace:~</text><text x="751" y="198" font-size="15" fill="#42e8e0" font-weight="400" class="mono">$ whoami</text><text x="751" y="225" font-size="15" fill="#edf4ff" font-weight="400" class="mono">  software.developer</text><text x="751" y="252" font-size="15" fill="#42e8e0" font-weight="400" class="mono">$ cat interests.json</text><text x="751" y="279" font-size="15" fill="#a995ff" font-weight="400" class="mono">  [&quot;web&quot;, &quot;data&quot;, &quot;creative-ui&quot;]</text><text x="751" y="306" font-size="15" fill="#42e8e0" font-weight="400" class="mono">$ build --with-personality</text><text x="751" y="333" font-size="15" fill="#f3a6ca" font-weight="400" class="mono">  ideas → interfaces → experiencias</text><rect x="751" y="356" width="10" height="17" rx="1" fill="#42e8e0" stroke="none" class="blink"/></g><g class="float2"><rect x="1064" y="95" width="70" height="28" rx="14" fill="#0e192b" stroke="#42e8e0" stroke-opacity=".5"/><text x="1078" y="114" font-size="12" fill="#42e8e0" font-weight="600" letter-spacing="1">&lt;/&gt;</text><rect x="707" y="407" width="118" height="28" rx="14" fill="#0e192b" stroke="#f3a6ca" stroke-opacity=".5"/><text x="721" y="426" font-size="12" fill="#f3a6ca" font-weight="600" letter-spacing="1">{ data }</text><rect x="1080" y="414" width="105" height="28" rx="14" fill="#0e192b" stroke="#a995ff" stroke-opacity=".5"/><text x="1094" y="433" font-size="12" fill="#a995ff" font-weight="600" letter-spacing="1">UI / UX</text></g></svg>