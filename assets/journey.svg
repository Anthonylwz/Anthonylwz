<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="276" viewBox="0 0 1280 276" role="img" aria-labelledby="title desc"><title id="title">Formación SENATI y experiencia en soporte y sistemas</title><desc id="desc">Diseño original para el perfil público de Anthony Alex. Las animaciones respetan la preferencia de movimiento reducido.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080e1c"/><stop offset="1" stop-color="#211735"/></linearGradient><linearGradient id="accent"><stop stop-color="#42e8e0"/><stop offset=".55" stop-color="#a995ff"/><stop offset="1" stop-color="#f3a6ca"/></linearGradient><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity=".04"/></pattern></defs><style>
text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,monospace}
.dash{stroke-dasharray:5 12;animation:route 18s linear infinite}
.float{animation:float 6s ease-in-out infinite}.float2{animation:float 7s ease-in-out infinite;animation-delay:-3s}
.blink{animation:blink 1.2s steps(2,end) infinite}.pulse{animation:pulse 4s ease-in-out infinite}
.spin{transform-origin:1020px 248px;animation:spin 45s linear infinite}
.scan{animation:scan 7s ease-in-out infinite}.crawl{animation:route 12s linear infinite}
@keyframes route{to{stroke-dashoffset:-340}}@keyframes float{50%{transform:translateY(-9px)}}
@keyframes blink{50%{opacity:0}}@keyframes pulse{50%{opacity:.35}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes scan{50%{transform:translateY(108px)}}
@media(prefers-reduced-motion:reduce){.dash,.float,.float2,.blink,.pulse,.spin,.scan,.crawl{animation:none}}
</style><rect x="1" y="1" width="1278" height="274" rx="18" fill="#080d19" stroke="#26354c" /><text x="28" y="37" font-size="12" fill="#a995ff" font-weight="700" letter-spacing="3">MI RECORRIDO</text><path d="M49 84H1214" fill="none" stroke="#26354c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="39" cy="84" r="9" fill="#080d19" stroke="#42e8e0" stroke-width="3"/><text x="28" y="124" font-size="11" fill="#8fa3bf" font-weight="600" letter-spacing="1">2024 — 2026</text><text x="28" y="163" font-size="24" fill="#edf4ff" font-weight="700" >SENATI</text><text x="28" y="193" font-size="14" fill="#42e8e0" font-weight="600" >Ingeniería de Software con IA</text><text x="28" y="223" font-size="13" fill="#8fa3bf" font-weight="400" >Formación técnica en desarrollo.</text><circle cx="352" cy="84" r="9" fill="#080d19" stroke="#a995ff" stroke-width="3"/><text x="341" y="124" font-size="11" fill="#8fa3bf" font-weight="600" letter-spacing="1">MAR — JUL 2025</text><text x="341" y="163" font-size="24" fill="#edf4ff" font-weight="700" >Matrixx Electronics</text><text x="341" y="193" font-size="14" fill="#a995ff" font-weight="600" >Técnico en Computación</text><text x="341" y="223" font-size="13" fill="#8fa3bf" font-weight="400" >Hardware y soporte técnico.</text><circle cx="665" cy="84" r="9" fill="#080d19" stroke="#f3a6ca" stroke-width="3"/><text x="654" y="124" font-size="11" fill="#8fa3bf" font-weight="600" letter-spacing="1">AGO — DIC 2025</text><text x="654" y="163" font-size="24" fill="#edf4ff" font-weight="700" >PC SYSTEM</text><text x="654" y="193" font-size="14" fill="#f3a6ca" font-weight="600" >Técnico de Computadoras</text><text x="654" y="223" font-size="13" fill="#8fa3bf" font-weight="400" >Diagnóstico y mantenimiento.</text><circle cx="978" cy="84" r="9" fill="#080d19" stroke="#42e8e0" stroke-width="3"/><text x="967" y="124" font-size="11" fill="#8fa3bf" font-weight="600" letter-spacing="1">DESDE FEB 2025</text><text x="967" y="163" font-size="24" fill="#edf4ff" font-weight="700" >SIA CETPRO</text><text x="967" y="193" font-size="14" fill="#42e8e0" font-weight="600" >Auxiliar de Sistemas</text><text x="967" y="223" font-size="13" fill="#8fa3bf" font-weight="400" >Soporte e infraestructura.</text><text x="28" y="255" font-size="11" fill="#8fa3bf" font-weight="400" >Experiencia y formación descritas en mi portafolio público.</text></svg>