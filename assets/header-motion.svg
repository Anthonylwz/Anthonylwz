<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
<title id="title">Anthony Alex · Desarrollo web y datos</title>
<desc id="desc">Portada animada con escritura, una ventana de código flotante y señales que viajan hacia los datos.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}
.cursor{animation:blink 1s steps(2,end) infinite}.flow{stroke-dasharray:5 20;animation:flow 3s linear infinite}.scene{animation:float 4s ease-in-out infinite}.brackets{transform-origin:850px 128px;animation:breathe 4s ease-in-out infinite}.line{stroke-dasharray:49;animation:write 4s ease-in-out infinite}.line.two{animation-delay:-1s}.line.three{animation-delay:-2s}.dot{animation:pulse 2s ease-in-out infinite}.dot.two{animation-delay:.3s}.dot.three{animation-delay:.6s}.name{animation:reveal 1.6s ease-out both}
@keyframes blink{50%{opacity:0}}@keyframes flow{to{stroke-dashoffset:-100}}@keyframes float{0%,100%{transform:translateY(5px)}50%{transform:translateY(-5px)}}@keyframes breathe{0%,100%{transform:scale(.96)}50%{transform:scale(1.05)}}@keyframes write{0%,100%{stroke-dashoffset:49;opacity:.4}45%,75%{stroke-dashoffset:0;opacity:1}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes reveal{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
@media(prefers-reduced-motion:reduce){.cursor,.flow,.scene,.brackets,.line,.dot,.name{animation:none}.signal{display:none}}
</style>
